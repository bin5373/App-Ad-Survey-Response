<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앱 광고 서비스 이용 경험과 선택 요인 설문조사</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0E2C57; --navy-h:#183F78; --tint:#EDF1F7; --tint2:#DCE4F0;
  --ink:#161A22; --sub:#596170; --mute:#8A919C; --line:#DDE1E7; --bg:#F3F4F6; --err:#B42318;
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.62;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy-h);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:13px 24px 11px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.top .org{display:block;font-size:11.5px;color:var(--mute);line-height:1.3}
.top .ttl{display:block;font-size:14px;font-weight:600;color:var(--navy);line-height:1.4}
.top .step{font-size:12.5px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.top .step small{font-weight:500;color:var(--mute);margin-right:4px}
.top-r{display:flex;align-items:center;gap:12px}
.top-r{flex:none}
.lang-sm{display:flex;flex:none;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.lang-sm button{white-space:nowrap}
.lang-sm button{border:0;background:#fff;font-size:11.5px;font-weight:600;padding:4px 8px;cursor:pointer;color:var(--mute)}
.lang-sm button + button{border-left:1px solid var(--line)}
.lang-sm button.on{background:var(--navy);color:#fff}
.lang-pick{display:flex;gap:8px;margin:0 0 26px}
.lang-pick button{flex:1;max-width:180px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:11px 12px;font-size:14.5px;font-weight:600;cursor:pointer;transition:all .12s}
.lang-pick button span{display:block;font-size:11.5px;font-weight:400;color:var(--mute);margin-top:1px}
.lang-pick button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.lang-pick button.on span{color:#C8D3E5}
.intro .time{display:inline-block;font-size:13px;font-weight:600;color:var(--navy);background:var(--tint);border-radius:4px;padding:3px 9px;margin-bottom:16px}
.bar{height:4px;background:#E8EBEF}
.bar i{display:block;height:100%;width:0;background:var(--navy);transition:width .3s ease}

/* sheet */
.wrap{max-width:760px;margin:0 auto;padding:28px 24px 150px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:3px;padding:38px 40px 14px}
.sec{font-size:12.5px;font-weight:700;color:var(--navy);letter-spacing:.01em;padding-bottom:11px;border-bottom:2px solid var(--navy);margin-bottom:30px}
.sec.has-sub{margin-bottom:8px}
.pg-sub{font-size:13px;color:var(--sub);margin-bottom:30px}
.pg-i{font-size:14px;color:var(--sub);margin:0 0 30px;padding:12px 14px;background:var(--bg);border-radius:4px}
.pg-i p + p{margin-top:4px}

/* question */
.q{margin-bottom:44px}
.qh{display:flex;gap:10px;align-items:baseline}
.qno{flex:none;min-width:2.9em;font-weight:700;color:var(--navy);font-size:15px;font-variant-numeric:tabular-nums}
.qt{font-size:16.5px;font-weight:600;line-height:1.5}
.qn{margin:6px 0 0 calc(2.9em + 10px);font-size:13.5px;color:var(--sub)}
.qn b{color:var(--ink);font-weight:600}
.qb{margin:14px 0 0 calc(2.9em + 10px)}
.q,.dsec{scroll-margin-top:96px}
.miss-msg{margin:8px 0 0 calc(2.9em + 10px);font-size:13px;font-weight:500;color:var(--err)}
.miss-msg.dm{margin:14px 0 0}
.q.miss .qno,.q.miss .qt{color:var(--err)}
.q.miss .opts,.q.miss textarea{border-color:#E9B8B2}
.mx-item.miss .mx-t b,.bstep.miss .step-t{color:var(--err)}
.mx-item.miss .pl,.bstep.miss .chip{border-color:#E9B8B2}
.skip{margin:-20px 0 40px calc(2.9em + 10px);font-size:13.5px;color:var(--mute)}

/* options list */
.opts{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 15px;cursor:pointer;border-top:1px solid var(--line);transition:background .12s;user-select:none}
.opt:first-child{border-top:0}
.opt:hover{background:#F8F9FB}
.opt.on{background:var(--tint)}
.opt .ot{flex:1}
.mk{flex:none;width:18px;height:18px;margin-top:3px;border:1.5px solid #A3AAB5;background:#fff;position:relative;transition:all .12s}
.mk.ci{border-radius:50%}
.mk.sq{border-radius:4px}
.opt.on .mk{border-color:var(--navy);background:var(--navy)}
.opt.on .mk.ci::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}
.opt.on .mk.sq::after{content:'';position:absolute;left:5px;top:1.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.oth{padding:0 15px 12px 45px;background:var(--tint)}
.opt-tag{font-size:12px;color:var(--mute);margin-left:6px}

input[type=text],input[type=email],textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);transition:border-color .12s}
input[type=text]:focus,textarea:focus{border-color:var(--navy-h);outline:none;box-shadow:0 0 0 3px rgba(24,63,120,.12)}
textarea{resize:vertical;min-height:88px;line-height:1.55}
::placeholder{color:#A5ABB4}

/* pills (scales) */
.pills{display:grid;gap:6px}
.pills.n5{grid-template-columns:repeat(5,1fr)}
.pills.n6{grid-template-columns:repeat(5,1fr) 1.15fr}
.pl{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 4px;font-size:14.5px;font-weight:600;cursor:pointer;text-align:center;line-height:1.3;transition:all .12s;font-variant-numeric:tabular-nums}
.pl small{display:block;font-size:11.5px;font-weight:400;color:var(--sub);margin-top:3px}
.pl:hover{border-color:#B9C1CD}
.pl.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pl.on small{color:#C8D3E5}
.pl.dk{font-weight:500;font-size:13.5px;color:var(--sub)}
.pl.dk.on{color:#fff}
.anch{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}

.scale-key{font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:4px;padding:9px 12px;margin-bottom:4px}
.mx-item{padding:18px 0 16px;border-top:1px solid var(--line)}
.mx-item:first-of-type{border-top:0}
.mx-t b{display:block;font-weight:600;font-size:15px}
.mx-t span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.mx-item .pills{margin-top:11px}

/* B1 */
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:4px;padding:12px 14px;margin-bottom:6px}
.legend div{display:flex;gap:7px}
.legend b{flex:none;color:var(--navy);font-weight:700;width:1em}
.bstep{padding:18px 0 16px;border-top:1px solid var(--line)}
.bstep:first-of-type{border-top:0}
.step-t{font-weight:600}
.step-d{font-size:13px;color:var(--sub);margin-top:2px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:11px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left;line-height:1.3;transition:all .12s}
.chip b{font-weight:700;color:var(--navy);font-size:13.5px}
.chip:hover{border-color:#B9C1CD}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on b{color:#fff}
.chips .gap{grid-column:span 1}

/* text + flags */
.tf + .tf{margin-top:22px}
.tf-l{display:block;font-weight:600;font-size:14.5px;margin-bottom:8px}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fl{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--sub);transition:all .12s}
.fl.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* tabs (D) */
.tabs{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:0 0 6px}
.tab{flex:1;padding:10px 8px;font-size:13.5px;background:#fff;border:0;border-left:1px solid var(--line);cursor:pointer;line-height:1.35}
.tab:first-child{border-left:0}
.tab.on{background:var(--navy);color:#fff}
.tab .cnt{display:block;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.dwho{font-size:13px;color:var(--sub);margin:14px 0 2px}
.dwho b{color:var(--ink)}

/* intro */
.intro h1{font-size:21px;font-weight:700;line-height:1.42;letter-spacing:-.02em;margin:0 0 18px}
.intro p{margin-bottom:12px}
.intro .def{color:var(--sub)}
.howto{font-size:13.5px;color:var(--sub);background:var(--bg);border-radius:4px;padding:12px 14px;margin:20px 0 30px}
.howto b{color:var(--ink);font-weight:600}
.terms{border-top:1px solid var(--line);padding-top:24px;margin-bottom:26px}
.terms h2{font-size:15px;font-weight:700;margin-bottom:6px}
.terms .lead{font-size:14px;color:var(--sub);margin-bottom:16px}
.terms dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14.5px}
.terms dt{font-weight:700;color:var(--navy);white-space:nowrap}
.terms .note{font-size:13.5px;color:var(--sub);margin-top:14px}

.consent-box{font-size:13px;color:var(--sub);background:var(--bg);border-radius:4px;padding:11px 13px;margin:10px 0}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
.nav-in{max-width:760px;margin:0 auto;padding:12px 24px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
.btn{font-size:15px;font-weight:600;border-radius:6px;padding:12px 22px;cursor:pointer;border:1px solid transparent;transition:background .12s}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{background:#F7F8FA}
.btn.solid{background:var(--navy);color:#fff;min-width:124px}
.btn.solid:hover{background:var(--navy-h)}
.btn:disabled{opacity:.45;cursor:default}
.err{flex:1;font-size:13px;color:var(--err);line-height:1.45}
.nav .sp{margin-left:auto}

.end{text-align:center;padding:40px 0 34px}
.end h1{font-size:20px;font-weight:700;margin-bottom:10px}
.end p{color:var(--sub);font-size:14.5px}
.foot{max-width:760px;margin:16px auto 0;padding:0 24px;font-size:12px;color:var(--mute)}

@media (max-width:600px){
  .top-in{padding:11px 18px 9px}
  .top .ttl{font-size:13.5px}
  .top .org{display:none}
  .wrap{padding:0 0 150px}
  .sheet{border-left:0;border-right:0;border-top:0;border-radius:0;padding:24px 18px 6px}
  .qn,.qb,.skip,.miss-msg{margin-left:0}
  .qt{font-size:16px}
  .chips{grid-template-columns:repeat(2,1fr)}
  .legend{grid-template-columns:1fr}
  .pills.n6{grid-template-columns:repeat(5,1fr) 1.3fr;gap:5px}
  .pl{padding:9px 2px}
  .nav-in{padding:10px 18px calc(10px + env(safe-area-inset-bottom))}
  .btn{padding:12px 18px}
  .btn.solid{min-width:108px}
  .terms dl{grid-template-columns:1fr;gap:2px}
  .terms dd{margin-bottom:10px}
  .foot{padding:0 18px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div><span class="org" id="h-org">충남대학교 경영학부 학생 연구팀</span><span class="ttl" id="h-ttl">앱 광고 서비스 이용 경험과 선택 요인 설문조사</span></div>
    <div class="top-r"><span class="step" id="step"></span><div class="lang-sm" role="group" aria-label="Language"><button type="button" data-act="lang" data-v="ko">KO</button><button type="button" data-act="lang" data-v="en">EN</button></div></div>
  </div>
  <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="prog"></i></div>
</header>

<main class="wrap"><div class="sheet" id="main"></div><p class="foot" id="foot">응답 내용은 수업용 조사 분석에만 활용됩니다.</p></main>

<nav class="nav" id="nav">
  <div class="nav-in">
    <button class="btn ghost" id="prev" type="button">이전</button>
    <span class="err" id="err" role="alert"></span>
    <button class="btn solid" id="next" type="button">다음</button>
  </div>
</nav>

<script>

  started_at: ''
};

const $ = s => document.querySelector(s);

const arr = k => Array.isArray(ans[k]) ? ans[k] : [];

/* ---------- 언어 (한국어 / English) ---------- */
// 시트에는 언어와 관계없이 한국어 보기 문구가 저장됩니다. lang 열로 응답 언어를 구분합니다.
let LANG = (() => {
  try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'ko') return q; } catch (e) {}
  return 'ko';
})();
const L = (ko, en) => LANG === 'en' ? en : ko;
const EN = {
  // 화면 공통
  '조사 안내':'About this survey',

  '앱 광고 이용·검토 상태와 현재 방법':'Paid app advertising: usage/review status and current methods',
  'B. 현재 방법의 실제 경험 한 번만 작성':'B. Your actual experience with your current approach',

  '기타 업체':'Other service', '현재 이용하지 않음':'Not currently using any',

function T(s){
  if (LANG !== 'en' || s == null) return s;
  if (EN[s] != null) return EN[s];
  let m = /^(\d+\.?\s+|[①-⑧]\s)(.+)$/.exec(s);           // "3. 사용", "① …", "2  …"
  if (m && EN[m[2]] != null) return m[1] + EN[m[2]];
  m = /^기타: (.*)$/.exec(s);
  if (m) return 'Other: ' + m[1];
  return s;
}

function dMissing(){
  const comp = dCompanies();

    const left = D_ITEMS.filter(it => ans[`D${it.n}_v${comp[j]}`] == null).map(it => 'D' + it.n);
    if (left.length) return {tab:j, msg:L(`업체 ${'①②③'[j]} ${vendorLabel(comp[j])}: ${left.join(', ')} 항목에 응답해 주십시오.`, `Service ${'①②③'[j]} ${T(vendorLabel(comp[j]))}: please answer ${left.join(', ')}.`)};
  }
  return null;
}

    case 'single':
      if (ans[q.id] == null) return L('응답해 주십시오.', 'Please answer this question.');
      return otherEmpty(q, ans[q.id]) ? L('기타 내용을 적어 주십시오.', 'Please describe your “Other” answer.') : null;
    case 'multi': {
      const a = arr(q.id);
      if (!a.length) return L('하나 이상 선택해 주십시오.', 'Please select at least one option.');
      return a.some(c => otherEmpty(q, c)) ? L('기타 내용을 적어 주십시오.', 'Please describe your “Other” answer.') : null;
    }
    case 'scale': return ans[q.id] == null ? L('응답해 주십시오.', 'Please answer this question.') : null;
    case 'matrix': {
      const left = q.items.filter(it => ans[q.key(it.n)] == null).map(it => it.n);
      return left.length ? L(`${left.join(', ')}번 항목에 응답해 주십시오.`, `Please answer item(s) ${left.join(', ')}.`) : null;
    }
    case 'b1': {
      const left = STEPS.filter(s => !ans['B1_' + s.n]).map(s => s.n);
      return left.length ? L(`${left.join(', ')}단계의 기호를 골라 주십시오.`, `Please choose a code for stage(s) ${left.join(', ')}.`) : null;
    }
    case 'textflags': {
      const left = q.items.filter(it => !(ans[it.k] || '').trim() && !ans[it.k + '_flag']).map(it => T(it.l).charAt(0));
      return left.length ? L(`${left.join('·')} 항목을 적거나 아래 보기 중 하나를 선택해 주십시오.`, `For item(s) ${left.join(', ')}, please write an answer or choose one of the options below.`) : null;
    }
    case 'dgrid': { const m = dMissing(); return m ? m.msg : null; }
  }
  return null;
}
function checkPage(p){
  missing = {};
  (p.qs || []).forEach(id => {
    const q = Q[id];
    if ((q.show && !q.show()) || OPTIONAL.has(id)) return;
    const m = missingMsg(q);
    if (m){
      missing[id] = m;
      if (q.type === 'dgrid'){ const d = dMissing(); if (d && d.tab != null) dTab = d.tab; }
    }
  });
  return Object.keys(missing);
}
// 이미 누락 표시된 문항이면 현재 상태 기준으로 다시 계산
const liveMiss = q => missing[q.id] ? missingMsg(q) : null;
const visible = () => PAGES.filter(p => !p.show || p.show());

/* ---------- 렌더링 ---------- */
const getOpts = q => typeof q.options === 'function' ? q.options() : q.options;
const allOpts = q => q.allOptions || getOpts(q);
const txt = v => typeof v === 'function' ? v() : v;

function optList(q, multi){
  const opts = getOpts(q);
  const cur = multi ? arr(q.id) : ans[q.id];
  return `<div class="opts" role="${multi ? 'group' : 'radiogroup'}">` + opts.map(o => {
    const on = multi ? cur.includes(o.c) : cur === o.c;
    return `<div class="opt${on ? ' on' : ''}" role="${multi ? 'checkbox' : 'radio'}" aria-checked="${on}" tabindex="0" data-act="${multi ? 'toggle' : 'pick'}" data-q="${q.id}" data-c="${o.c}"><span class="mk ${multi ? 'sq' : 'ci'}"></span><span class="ot">${esc(T(o.t))}</span></div>`
      + (o.other && on ? `<div class="oth"><input type="text" data-act="text" data-k="${q.id}_other" value="${esc(ans[q.id + '_other'])}" placeholder="${L('직접 입력', 'Please specify')}" aria-label="${L('기타 내용', 'Other')}"></div>` : '');
  }).join('') + `</div>`;
}

function pills(k, opts, cls){
  return `<div class="pills ${cls}">` + opts.map(o =>
    `<button type="button" class="pl${o.dk ? ' dk' : ''}${ans[k] === o.c ? ' on' : ''}" aria-pressed="${ans[k] === o.c}" data-act="set" data-k="${k}" data-c="${o.c}">${esc(T(o.t))}${o.s ? `<small>${esc(T(o.s))}</small>` : ''}</button>`
  ).join('') + `</div>`;
}
const P15 = [1,2,3,4,5].map(n => ({c:n, t:String(n)})).concat([{c:9, t:'모름', dk:true}]);

function body(q){
  const miss = !!liveMiss(q);
  switch (q.type){
    case 'single': return optList(q, false);
    case 'multi':  return optList(q, true);
    case 'scale':  return pills(q.id, q.options, 'n5');
    case 'text':   return `<textarea data-act="text" data-k="${q.id}" rows="3" placeholder="${L('자유롭게 적어 주십시오.', 'Feel free to write here.')}">${esc(ans[q.id])}</textarea>`;
    case 'textflags':
      return q.items.map(it => `<div class="tf"><label class="tf-l" for="${it.k}">${esc(T(it.l))}</label>
        <textarea id="${it.k}" data-act="text" data-k="${it.k}" data-clear="${it.k}_flag" rows="2">${esc(ans[it.k])}</textarea>
        <div class="flags">${it.flags.map(f => `<button type="button" class="fl${ans[it.k + '_flag'] === f ? ' on' : ''}" data-act="flag" data-k="${it.k}" data-v="${esc(f)}">${esc(T(f))}</button>`).join('')}</div></div>`).join('');
    case 'matrix':
      return `<div class="scale-key">${esc(T(q.scaleKey))}</div>` + q.items.map(it =>
        `<div class="mx-item${miss && ans[q.key(it.n)] == null ? ' miss' : ''}"><div class="mx-t"><b>${it.n}. ${esc(T(it.t))}</b><span>${esc(T(it.d))}</span></div>${pills(q.key(it.n), P15, 'n6')}</div>`).join('');
    case 'b1':
      return `<div class="legend">${BARRIERS.map(b => `<div><b>${b.c}</b><span><strong style="font-weight:600;color:var(--ink)">${T(b.s)}</strong> · ${esc(T(b.d))}</span></div>`).join('')}</div>`
        + STEPS.map(s => `<div class="bstep${miss && !ans['B1_' + s.n] ? ' miss' : ''}"><div class="step-t">${s.n}. ${T(s.t)}</div><div class="step-d">${esc(T(s.d))}</div>
          <div class="chips" role="radiogroup" aria-label="${L(s.n + '단계', 'Stage ' + s.n)}">${BARRIERS.map(b => {
            const on = ans['B1_' + s.n] === b.c;
            return `<button type="button" class="chip${on ? ' on' : ''}" aria-pressed="${on}" data-act="set" data-k="B1_${s.n}" data-c="${b.c}"><b>${b.c}</b>${T(b.s)}</button>`;
          }).join('')}</div></div>`).join('');
    case 'contact':
      return `<input type="text" data-act="text" data-k="contact" value="${esc(ans.contact)}" placeholder="${L('이메일 주소 또는 연락 방법', 'Email address or contact method')}" autocomplete="email">

        <div class="opts"><div class="opt${ans.contact_consent ? ' on' : ''}" role="checkbox" aria-checked="${!!ans.contact_consent}" tabindex="0" data-act="bool" data-k="contact_consent"><span class="mk sq"></span><span class="ot">${L('위 내용을 확인했으며, 연락처 수집·이용에 동의합니다.', 'I have read the above and agree to the collection and use of my contact information.')}</span></div></div>`;

function dgrid(){
  const used = usedVendors();
  let h = L(`<div class="pg-i"><p>최근 6개월 동안 실제 이용한 업체만 평가해 주십시오. (6개월 미만이면 실제 이용 기간 기준)</p>

    `<div class="pg-i"><p>Please rate only services you actually used in the past 6 months (or during your actual period of use, if shorter).</p>
    <p>For each row, choose one of ①–⑤ (① Very poor · ③ Average · ⑤ Very good). If you are not sure, choose <b>Don't know</b>.</p></div>`);
  if (used.length > 3){
    const q = {id:'D_pick', options:vendorOpts(used)};
    h += `<section class="q"><div class="qh"><span class="qno">D0</span><h2 class="qt">${L('평가할 업체를 최대 3곳 골라 주십시오.', 'Please choose up to 3 services to rate.')}</h2></div>
      <p class="qn">${L('A3에서 4곳 이상을 선택하셨습니다. 평가할 수 있는 업체를 최대 3곳까지 골라 주십시오.', 'You selected 4 or more services in A3. Please choose up to 3 that you can rate.')}</p><div class="qb">${optList(q, true)}</div></section>`;
  }
  const comp = dCompanies();
  if (!comp.length) return h;
  if (dTab >= comp.length) dTab = 0;
  const v = comp[dTab];
  const done = c => D_ITEMS.filter(it => ans[`D${it.n}_v${c}`] != null).length;
  h += `<div class="tabs" role="tablist">${comp.map((c, i) => `<button type="button" role="tab" aria-selected="${i === dTab}" class="tab${i === dTab ? ' on' : ''}" data-act="tab" data-i="${i}">${L('업체', 'Service')} ${'①②③'[i]} ${esc(T(vendorLabel(c)))}<span class="cnt">${done(c)} / 8</span></button>`).join('')}</div>`;
  h += `<p class="dwho">${L('지금 평가 중인 업체', 'Now rating')}: <b>${esc(T(vendorLabel(v)))}</b></p>`;
  const PD = [1,2,3,4,5].map(n => ({c:n, t:'①②③④⑤'[n-1]})).concat([{c:9, t:'모름', dk:true}]);
  const dmiss = !!liveMiss(Q.D);
  h += D_ITEMS.map(it => `<div class="mx-item${dmiss && ans[`D${it.n}_v${v}`] == null ? ' miss' : ''}"><div class="mx-t"><b>D${it.n}. ${esc(T(it.t))}</b><span>${esc(T(it.d))}</span></div>${pills(`D${it.n}_v${v}`, PD, 'n6')}<div class="anch"><span>${L('나쁨', 'Poor')}</span><span style="margin-right:16%">${L('좋음', 'Good')}</span></div></div>`).join('');
  if (dTab < comp.length - 1) h += `<p class="dwho" style="margin-top:18px">${L('이 업체를 마치면 위의 다음 업체 탭을 눌러 이어서 평가해 주십시오.', 'When you finish this service, tap the next service tab above to continue.')}</p>`;
  return h;
}

function renderQ(id){

  return L(`<div class="end"><h1>응답이 제출되었습니다</h1><p>설문에 응답해 주셔서 진심으로 감사드립니다.</p></div>`,

function render(keepScroll){
  const y = window.scrollY;
  const main = $('#main');
  if (cur === 'refuse' || cur === 'done'){
    main.innerHTML = renderEnd(cur);
    $('#next').style.display = 'none';
    $('#prev').style.display = cur === 'refuse' ? '' : 'none';
    setProgress(cur === 'done' ? 100 : null);
    setErr('');
    return;
  }
  const p = page(cur);
  main.innerHTML = p.render ? p.render()
    : `<p class="sec${p.sub ? ' has-sub' : ''}">${esc(T(p.sec))}</p>${p.sub ? `<p class="pg-sub">${esc(T(p.sub))}</p>` : ''}`
      + (p.intro ? `<div class="pg-i">${esc(T(p.intro))}</div>` : '')
      + p.qs.map(renderQ).join('');
  const v = visible(), i = v.findIndex(x => x.id === cur);
  $('#prev').style.display = i > 0 ? '' : 'none';
  $('#next').style.display = '';
  $('#next').textContent = i === v.length - 1 ? L('제출', 'Submit') : (cur === 'intro' ? L('시작하기', 'Start') : L('다음', 'Next'));
  setProgress(v.length > 1 ? Math.round((i / (v.length - 1)) * 100) : 0);
  if (keepScroll) window.scrollTo(0, y);
}

// 진행률: 현재 응답 경로(분기 반영) 기준 몇 % 왔는지 표시
function setProgress(pct){
  const st = $('#step');
  if (pct == null){ st.innerHTML = ''; $('#prog').style.width = '0'; return; }
  st.innerHTML = `<small>${L('진행률', 'Progress')}</small>${pct}%`;
  $('#prog').style.width = pct + '%';
  $('#bar').setAttribute('aria-valuenow', pct);
}

function setErr(m){ $('#err').textContent = m || ''; }

function go(id){
  cur = id;
  missing = {};
  const p = page(id);
  if (p && p.enter) p.enter();
  setErr('');
  render(false);
  window.scrollTo(0, 0);
}

const parseC = s => /^\d+$/.test(s) ? Number(s) : s;

function toggleMulti(q, c){
  let a = arr(q.id).slice();
  const opts = q.id === 'D_pick' ? vendorOpts(usedVendors()) : getOpts(q);
  const o = opts.find(x => x.c === c);
  const max = q.id === 'D_pick' ? 3 : q.max;
  if (a.includes(c)) a = a.filter(x => x !== c);
  else if (o && o.excl) a = [c];
  else {
    a = a.filter(x => !(opts.find(y => y.c === x) || {}).excl);
    if (max && a.length >= max){ setErr(L(`최대 ${max}개까지 선택할 수 있습니다. 다른 보기를 해제한 뒤 선택해 주십시오.`, `You can select up to ${max}. Please deselect another option first.`)); return false; }
    a.push(c);
  }
  ans[q.id] = a;
  return true;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  const act = el.dataset.act, k = el.dataset.k || el.dataset.q;
  setErr('');
  if (act === 'pick'){
    const c = parseC(el.dataset.c);
    if (ans[k] === c) delete ans[k]; else ans[k] = c;
  } else if (act === 'toggle'){
    const q = Q[k] || {id:k};
    if (!toggleMulti(q, parseC(el.dataset.c))) return;
  } else if (act === 'set'){
    const c = parseC(el.dataset.c);
    if (ans[k] === c) delete ans[k]; else ans[k] = c;
  } else if (act === 'bool'){
    ans[k] = !ans[k];
  } else if (act === 'flag'){
    const v = el.dataset.v;
    if (ans[k + '_flag'] === v) delete ans[k + '_flag'];
    else { ans[k + '_flag'] = v; ans[k] = ''; }
  } else if (act === 'tab'){
    dTab = Number(el.dataset.i);
  } else if (act === 'lang'){
    setLang(el.dataset.v);
    return;
  } else return;
  render(true);
});

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.opt[data-act]')){ e.preventDefault(); e.target.click(); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.act !== 'text') return;
  ans[el.dataset.k] = el.value;
  if (el.dataset.clear && el.value.trim()){
    delete ans[el.dataset.clear];
    el.closest('.tf').querySelectorAll('.fl.on').forEach(b => b.classList.remove('on'));
  }
});

$('#next').addEventListener('click', () => {
  if (sending) return;
  const p = page(cur);
  const miss = checkPage(p);
  if (miss.length){
    render(true);
    setErr(L(`응답하지 않은 필수 문항이 ${miss.length}개 있습니다.`, `${miss.length} required question(s) not answered yet.`));
    const sec = document.getElementById('q-' + miss[0]);
    const el = sec && (sec.querySelector('.bstep.miss, .mx-item.miss') || sec);
    if (el) el.scrollIntoView({behavior:'smooth', block: el === sec ? 'start' : 'center'});
    return;
  }
  const msg = p.validate ? p.validate() : null;
  if (msg){ setErr(msg); return; }
  if (cur === 'pA1'){
    if (ans.A1 === 2){ cur = 'refuse'; render(false); window.scrollTo(0, 0); return; }
    if (!t0){ t0 = Date.now(); meta.started_at = new Date().toISOString(); }
  }
  const v = visible(), i = v.findIndex(x => x.id === cur);
  if (i === v.length - 1){ submit(); return; }
  go(v[i + 1].id);
});

$('#prev').addEventListener('click', () => {
  if (sending) return;
  if (cur === 'refuse'){ go('pA1'); return; }
  const v = visible(), i = v.findIndex(x => x.id === cur);
  if (i > 0) go(v[i - 1].id);
});

/* ---------- 전송 데이터 ---------- */
function cols(q, shown){
  const r = [];
  const S = (k, val) => r.push([k, shown ? val : NA]);
  const ao = q.allOptions || (typeof q.options === 'function' ? [] : q.options) || [];
  const lab = c => q.label ? q.label(c) : ((ao.find(o => o.c === c) || {}).t ?? c);
  const otherOpt = ao.find(o => o.other);
  switch (q.type){
    case 'single': {
      const c = ans[q.id];
      S(q.id, c == null ? '' : (q.store === 'code' ? c : lab(c)));
      if (otherOpt) S(q.id + '_기타', c === otherOpt.c ? (ans[q.id + '_other'] || '') : '');
      break;
    }
    case 'scale': S(q.id, ans[q.id] ?? ''); break;
    case 'multi': {
      const a = arr(q.id);
      S(q.id, a.map(lab).join('; '));
      ao.forEach(o => S(`${q.id}_${o.c}`, a.length ? (a.includes(o.c) ? 1 : 0) : ''));
      if (otherOpt) S(q.id + '_기타', a.includes(otherOpt.c) ? (ans[q.id + '_other'] || '') : '');
      break;
    }
    case 'text': S(q.id, ans[q.id] || ''); break;
    case 'textflags':
      q.items.forEach(it => { S(it.k, ans[it.k] || ''); S(it.k + '_선택', ans[it.k + '_flag'] || ''); });
      break;
    case 'matrix':
      q.items.forEach(it => { const v = ans[q.key(it.n)]; S(q.key(it.n), v == null ? '' : (v === 9 ? '모름' : v)); });
      break;
    case 'b1':
      STEPS.forEach(s => S('B1_' + s.n, ans['B1_' + s.n] || ''));
      break;
    case 'dgrid': {
      const comp = shown ? dCompanies() : [];
      [0,1,2].forEach(j => {
        const c = comp[j];
        r.push([`D_업체${j+1}`, !shown ? NA : (c ? vendorLabel(c) : '')]);
        D_ITEMS.forEach(it => {
          const v = c ? ans[`D${it.n}_v${c}`] : undefined;
          r.push([`D${it.n}_업체${j+1}`, !shown ? NA : (!c ? NA : (v == null ? '' : (v === 9 ? '모름' : v)))]);
        });
      });
      break;
    }
    case 'contact':
      S('interview_contact', ans.contact_consent ? (ans.contact || '').trim() : '');
      S('interview_consent', ans.contact_consent ? 'Y' : '');
      break;
  }
  return r;
}

function buildPayload(){
  const vis = visible();
  const vset = new Set(vis.map(p => p.id));
  const out = {
    respondent_id: meta.respondent_id,
    started_at: meta.started_at,
    duration_sec: t0 ? Math.round((Date.now() - t0) / 1000) : '',
    path: vis.map(p => p.id.replace(/^p/, '')).join('>'),
    intro_confirm: ans.intro_confirm ? 'Y' : '',
    lang: LANG
  };
  PAGES.forEach(p => (p.qs || []).forEach(id => {
    const q = Q[id];
    const shown = vset.has(p.id) && (!q.show || q.show());
    cols(q, shown).forEach(([k, v]) => { out[k] = v; });
  }));
  if (molocoCur()) out.C8 = '현재 서브 또는 주력 매체로 이용 중임 (A3 응답으로 자동 입력)';
  return out;
}

async function submit(){
  if (/여기에_웹앱_ID/.test(GAS_URL)){
    console.log('[설문] 전송 데이터 미리보기', buildPayload());
    setErr('제출 주소(GAS_URL)가 아직 설정되지 않았습니다. 콘솔에서 전송 데이터를 확인할 수 있습니다.');
    return;
  }
  sending = true;
  const btn = $('#next');
  btn.disabled = true; $('#prev').disabled = true;
  btn.textContent = L('제출 중…', 'Submitting…');
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(buildPayload())
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'save failed');
    cur = 'done'; render(false); window.scrollTo(0, 0);
  } catch (err){
    setErr(L('제출 중 문제가 발생했습니다. 잠시 후 다시 [제출]을 눌러 주십시오.', 'There was a problem submitting. Please wait a moment and press [Submit] again.'));
    btn.textContent = L('제출', 'Submit');
  } finally {
    sending = false; btn.disabled = false; $('#prev').disabled = false;
  }
}

window.addEventListener('beforeunload', e => {
  if (t0 && cur !== 'done' && cur !== 'refuse'){ e.preventDefault(); e.returnValue = ''; }
});

function applyChrome(){
  document.documentElement.lang = LANG;
  document.title = L('앱 광고 서비스 이용 경험과 선택 요인 설문조사', 'Survey on App Advertising Service Experience and Selection Factors');
  $('#h-org').textContent = L('충남대학교 경영학부 학생 연구팀', 'Chungnam National University · Business Administration student research team');
  $('#h-ttl').textContent = document.title;
  $('#foot').textContent = L('응답 내용은 수업용 조사 분석에만 활용됩니다.', 'Responses will be used only for analysis in this class study.');
  $('#prev').textContent = L('이전', 'Back');
  document.querySelectorAll('.lang-sm button').forEach(b => b.classList.toggle('on', b.dataset.v === LANG));
}
function setLang(v){
  if (v !== 'ko' && v !== 'en') return;
  LANG = v;
  try { const u = new URL(location.href); u.searchParams.set('lang', v); history.replaceState(null, '', u); } catch (e) {}
  if (Object.keys(missing).length) checkPage(page(cur) || {});
  setErr('');
  applyChrome();
  render(true);
}

applyChrome();
render(false);
</script>
